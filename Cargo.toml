[package]
name = "standard-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
derive_more = { version = "2.0.1", features = [ "display", "error", "from", "try_into", "is_variant" ] }
libc = { version = "0.2.174", optional = true }
triomphe = { version = "0.1.15", optional = true }

[features]
default = ["collections-all", "fs", "rc", "triomphe"]

collections = []
collections-all = ["circ", "cons", "contiguous", "hash", "linked", "traits"]
circ = ["collections"]
cons = ["collections"]
contiguous = ["collections"]
hash = ["collections", "traits"]
linked = ["collections"]
traits = ["collections"]

fs = ["dep:libc"]

rc = []
triomphe = ["dep:triomphe"]
